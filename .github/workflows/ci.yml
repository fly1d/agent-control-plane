name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: make lint
      - name: Type check
        run: make type
      - name: Unit and contract tests
        run: make test

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          load: true
          push: false
          tags: agent-control-plane:ci
      - name: Smoke packaged service
        run: |
          docker run --detach --name agent-control-plane-ci --publish 8000:8000 agent-control-plane:ci
          trap 'docker logs agent-control-plane-ci; docker rm --force agent-control-plane-ci' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          for attempt in range(20):
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8000/health/ready", timeout=2
                  ) as response:
                      assert json.load(response)["status"] == "ok"
                      break
              except (AssertionError, OSError, urllib.error.URLError):
                  if attempt == 19:
                      raise
                  time.sleep(0.5)

          def call(path, method="GET", payload=None):
              request = urllib.request.Request(
                  f"http://127.0.0.1:8000{path}",
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=2) as response:
                  return json.load(response)

          specification = {
              "agent_id": "ci-smoke-agent",
              "version": "1.0.0",
              "display_name": "CI Smoke Agent",
              "description": "Validates the packaged service contract.",
              "entrypoint": "https://agents.example.test/ci-smoke",
          }
          assert call("/v1/agent-specs/validate", "POST", specification)["valid"] is True
          registered = call(
              "/v1/agents",
              "POST",
              {"spec": specification, "actor": "ci@example.test"},
          )
          assert registered["revision"] == 1
          activated = call(
              "/v1/agents/ci-smoke-agent/status",
              "PATCH",
              {
                  "status": "active",
                  "expected_revision": 1,
                  "actor": "ci@example.test",
                  "reason": "Container readiness checks passed.",
              },
          )
          assert activated["status"] == "active"

          approval = call(
              "/v1/approvals",
              "POST",
              {
                  "agent_id": "ci-smoke-agent",
                  "action": "deployment.promote",
                  "risk": "high",
                  "actor": "ci-smoke-agent",
                  "reason": "Exercise the packaged governance loop.",
              },
          )
          decided = call(
              f"/v1/approvals/{approval['request_id']}/decision",
              "POST",
              {
                  "decision": "approve",
                  "actor": "ci-reviewer@example.test",
                  "reason": "Container smoke evidence passed.",
              },
          )
          assert decided["status"] == "approved"
          assert call("/v1/audit-events")["count"] == 4
          PY
